name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check code formatting & static analysis
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew check --no-daemon -x test

      - name: Run all tests
        run: ./gradlew test --no-daemon

      - name: Build Samples
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :samples:cli-jvm:assemble --no-daemon
