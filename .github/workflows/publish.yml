name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Build, Sign & Publish SDK
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify build and run tests
        run: ./gradlew check --no-daemon -x test

      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal --no-daemon
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}

      - name: Create Maven Central Bundle Zip
        run: ./gradlew bundleForMavenCentral --no-daemon

      - name: Upload Bundle Artifact (for manual inspection or Central Portal upload)
        uses: actions/upload-artifact@v4
        with:
          name: aivo-sdk-maven-central-bundle
          path: build/distributions/aivo-sdk-bundle-1.0.0.zip
          retention-days: 7

      - name: Publish to Sonatype Central Repository
        if: env.SONATYPE_USERNAME != '' && env.SONATYPE_PASSWORD != ''
        run: ./gradlew publishAllPublicationsToSonatypeCentralRepository --no-daemon
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}

      - name: Publish to GitHub Packages
        if: env.GITHUB_TOKEN != ''
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
